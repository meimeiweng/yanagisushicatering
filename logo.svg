<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Sushi roll illustration -->
  <g transform="translate(100, 100)">
    <!-- Main sushi roll (oval shape) -->
    <ellipse cx="0" cy="-8" rx="35" ry="28" fill="#d4af37" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Rice texture lines -->
    <circle cx="-15" cy="-15" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="0" cy="-20" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="15" cy="-15" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="-20" cy="-5" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="20" cy="-5" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="-15" cy="5" r="3" fill="#2c3e50" opacity="0.3"/>
    <circle cx="15" cy="5" r="3" fill="#2c3e50" opacity="0.3"/>
    
    <!-- Nori (seaweed) strip on top -->
    <rect x="-30" y="-12" width="60" height="8" fill="#1a1a1a" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Filling (red/salmon) -->
    <ellipse cx="0" cy="0" rx="25" ry="18" fill="#e74c3c" stroke="none"/>
    
    <!-- Chopsticks -->
    <line x1="-50" y1="20" x2="-20" y2="-5" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
    <line x1="-45" y1="25" x2="-15" y2="0" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Decorative element: small leaf -->
    <path d="M 45 -15 Q 50 -18 52 -12 Q 50 -8 45 -10" fill="none" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="-15" x2="52" y2="-12" stroke="#27ae60" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-family="Poppins, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2c3e50">
    YANAGI
  </text>
</svg>